import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, updateProfile } 
from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

const firebaseConfig = {
 apiKey: "{{ firebase_config.apiKey }}",
 authDomain: "{{ firebase_config.authDomain }}",
 projectId: "{{ firebase_config.projectId }}",
 storageBucket: "{{ firebase_config.storageBucket }}",
 messagingSenderId: "{{ firebase_config.messagingSenderId }}",
 appId: "{{ firebase_config.appId }}"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

function createUserId(name) {
    const prefix = (name || "User")
        .replace(/[^a-zA-Z]/g, "")
        .toUpperCase()
        .padEnd(3, "X")
        .slice(0, 3);
    const number = String(Math.floor(Math.random() * 999) + 1).padStart(3, "0");
    return `${prefix}${number}`;
}

function parseUserIdentity(user) {
    const displayName = user.displayName || "";
    const [storedUserId, ...nameParts] = displayName.split("|");

    if (/^[A-Z]{3}\d{3}$/.test(storedUserId)) {
        return {
            userId: storedUserId,
            userName: nameParts.join("|") || "User",
            needsProfileUpdate: false
        };
    }

    const fallbackName = displayName || user.email || "User";
    return {
        userId: createUserId(fallbackName),
        userName: fallbackName,
        needsProfileUpdate: true
    };
}

// LOGIN
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    const loginMessage = document.getElementById("loginMessage");
    const loginButton = document.querySelector("#loginForm button");

    loginButton.disabled = true;
    loginMessage.style.display = "none";

    try {
        // 1. Login using Firebase
        const userCredential = await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        const user = userCredential.user;

        // 2. Get Firebase ID token
        const idToken = await user.getIdToken();

        // 3. Send token to Flask
        const identityParts = (user.displayName || "").split("|");

        const userId = identityParts[0] || "";
        const name = identityParts.slice(1).join("|") || "";
        
        const response = await fetch("/set-user", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${idToken}`
            },
            credentials: "include",
            body: JSON.stringify({
                firebase_uid: user.uid,
                user_id: userId,
                name: name,
                email: user.email
            })
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.error || "Unable to load your student profile."
            );
        }

        // 4. Save existing Student ID
        if (result.user_id) {
            localStorage.setItem("userId", result.user_id);
        }

        // 5. Open dashboard
        window.location.href = "/dashboard";

    } catch (error) {
        console.error("Login error:", error);

        loginMessage.style.display = "block";
        loginMessage.textContent =
            error.message || "Login failed. Please try again.";

        loginMessage.classList.remove("success");
        loginMessage.classList.add("error");

    } finally {
        loginButton.disabled = false;
    }
});

// FORGOT PASSWORD
document.getElementById("forgotPassword").addEventListener("click", function() {

    const email = document.getElementById("loginEmail").value;

    if (!email) {
        alert("Please enter your email first 📧");
        return;
    }

    sendPasswordResetEmail(auth, email)
    .then(() => {
        alert("Password reset link sent to your email ✅");
    })
    .catch((error) => {
        alert(error.message);
    });

});
